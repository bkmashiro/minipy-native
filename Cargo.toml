[package]
name = "minipy-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
rustpython-parser = { version = "=0.4.0", default-features = false, features = ["num-bigint"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cranelift-codegen = { version = "=0.128.3", default-features = false, features = ["std", "unwind", "host-arch"] }
cranelift-frontend = "=0.128.3"
cranelift-jit = "=0.128.3"
cranelift-module = "=0.128.3"
cranelift-native = "=0.128.3"
tokio = { version = "=1.48.0", features = ["rt", "sync", "time", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "=1.48.0", features = ["rt", "sync", "macros"] }

[dependencies.bytes]
version = "=1.11.1"
optional = true

[dependencies.sonic-rs]
version = "=0.5.7"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.hyper]
version = "1"
features = ["client", "http1"]
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.hyper-util]
version = "0.1"
features = ["client-legacy", "http1", "tokio"]
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.hyper-rustls]
version = "0.27"
default-features = false
features = ["http1", "ring", "webpki-roots", "tls12"]
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.http-body-util]
version = "0.1"
optional = true

[features]
json-allocation-profile = ["tool-json"]
tool-json = ["dep:bytes", "dep:sonic-rs", "dep:serde", "dep:serde_json", "dep:hyper", "dep:hyper-util", "dep:hyper-rustls", "dep:http-body-util", "tokio/net", "tokio/io-util"]
debug-runtime = ["dep:serde", "dep:serde_json"]
fixture-reference = []
interpreter-profile = []
# Optional compiler pass profiling, absent from the default execution path.
compile-timing = ["cranelift-codegen/timing"]
compiler-profile = ["compile-timing"]

[profile.release]
debug = 1

[[example]]
name = "cx_probe"
required-features = ["tool-json"]

[[example]]
name = "di_corpus"
required-features = ["tool-json"]
