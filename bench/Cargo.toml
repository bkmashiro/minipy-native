[package]
name = "minipy-native-bench"
version = "0.1.0"
edition = "2024"
publish = false

[features]
allocation-diagnostics = []
string-probe = ["minipy-native/tool-json"]

[dependencies]
minipy-native = { path = "..", features = ["fixture-reference"] }
monty = { git = "https://github.com/pydantic/monty", rev = "56949a4c45f51cedc7a96450782f58a8017e114d" }
monty-types = { git = "https://github.com/pydantic/monty", rev = "56949a4c45f51cedc7a96450782f58a8017e114d" }
tokio = { version = "=1.48.0", features = ["rt", "sync", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "=1.11.1"
libc = "0.2"

[[bin]]
name = "quote-bench"
path = "src/main.rs"

[[bin]]
name = "bench-v2"
path = "src/v2.rs"

[[bin]]
name = "memory-v2"
path = "src/memory_v2.rs"

[[bin]]
name = "script-bench"
path = "src/scripts.rs"

[[bin]]
name = "ar-contains"
path = "src/bin/ar_contains.rs"
required-features = ["string-probe"]

[[bin]]
name = "bo-request"
path = "src/bin/bo_request.rs"
required-features = ["string-probe"]
